#set( $symbol_pound = '#' )
#set( $symbol_dollar = '$' )
# The template service with its databases. Every confidential or site-specific
# value comes from the environment, normally docker.conf/.env (copy env.example,
# never commit it); see ../README.md for what each security mode needs.
# Relative paths are relative to this folder.

name: ${symbol_dollar}{TPL_PROJECT:-${rootArtifactId}}

services:

  provtemplates:
    image: ${symbol_dollar}{TPL_IMAGE:-${rootArtifactId}-docker.temurin}
    restart: unless-stopped
    ports:
      - "${symbol_dollar}{TPL_HTTP_PORT:-8080}:8080"
    environment:
      # keycloak (the default), github or none
      - TPL_SECURITY_MODE=${symbol_dollar}{TPL_SECURITY_MODE:-keycloak}
      # the URL at which browsers reach this service, without the context (${serviceContext})
      - TPL_PUBLIC_URL=${symbol_dollar}{TPL_PUBLIC_URL:-http://localhost:${symbol_dollar}{TPL_HTTP_PORT:-8080}}
      # a security configuration mounted in the container, instead of the variables below
      - TPL_SECURITY_CONFIG=${symbol_dollar}{TPL_SECURITY_CONFIG:-}
      - KEYCLOAK_BASE_URI=${symbol_dollar}{KEYCLOAK_BASE_URI:-}
      - KEYCLOAK_REALM=${symbol_dollar}{KEYCLOAK_REALM:-}
      - KEYCLOAK_CLIENT_ID=${symbol_dollar}{KEYCLOAK_CLIENT_ID:-}
      - KEYCLOAK_DIRECT_CLIENT_ID=${symbol_dollar}{KEYCLOAK_DIRECT_CLIENT_ID:-}
      - KEYCLOAK_SIGNATURE_PUBLIC_KEY=${symbol_dollar}{KEYCLOAK_SIGNATURE_PUBLIC_KEY:-}
      - KEYCLOAK_ROLE=${symbol_dollar}{KEYCLOAK_ROLE:-provwriter}
      - GITHUB_CLIENT_ID=${symbol_dollar}{GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${symbol_dollar}{GITHUB_CLIENT_SECRET:-}
      - GITHUB_CACHE_TTL_SECONDS=${symbol_dollar}{GITHUB_CACHE_TTL_SECONDS:-300}
      # passed on unset when absent: the service refuses GitHub mode without an allowlist
      - GITHUB_ALLOWLIST
      - TPL_DB_USER=${symbol_dollar}{TPL_DB_USER:?TPL_DB_USER must be set, see env.example}
      - TPL_DB_PASS=${symbol_dollar}{TPL_DB_PASS:?TPL_DB_PASS must be set, see env.example}
      # activity counters (the dashboard's Activity tab); defaults inside the service
      - TPL_ACTIVITY_FLUSH_SECONDS=${symbol_dollar}{TPL_ACTIVITY_FLUSH_SECONDS:-10}
      - TPL_ACTIVITY_BUCKET_SECONDS=${symbol_dollar}{TPL_ACTIVITY_BUCKET_SECONDS:-10}
      - TPL_ACTIVITY_RETENTION_DAYS=${symbol_dollar}{TPL_ACTIVITY_RETENTION_DAYS:-400}
      - PROV_STORAGE_CONFIG=/home/pservice/config/storage-configuration.json
      - TEMPLATE_CONFIG=/home/pservice/config/template-config.json
      - TPL_HOST=${symbol_dollar}{TPL_PUBLIC_URL:-http://localhost:${symbol_dollar}{TPL_HTTP_PORT:-8080}}${serviceContext}
      - PROV_API=${symbol_dollar}{TPL_PUBLIC_URL:-http://localhost:${symbol_dollar}{TPL_HTTP_PORT:-8080}}${serviceContext}/provapi
      - CATALINA_OPTS=-DXPLAIN_LEXICON=/etc/dictionary/lexAccess2013.data
    volumes:
      - ${symbol_dollar}{TPL_DATA_DIR:-./deploy}/provtemplates:/home/pservice
      - ./config:/home/pservice/config:ro
    depends_on:
      redis:
        condition: service_started
      mongo:
        condition: service_started
      postgres16:
        condition: service_healthy

  postgres16:
    image: postgres:16
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "postgres", "-U", "postgres" ]
      timeout: 45s
      interval: 10s
      retries: 10
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${symbol_dollar}{POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set, see env.example}
      - POSTGRES_DB=templates
      - TPM_DB_USER=${symbol_dollar}{TPL_DB_USER:?TPL_DB_USER must be set, see env.example}
      - TPM_DB_PASS=${symbol_dollar}{TPL_DB_PASS:?TPL_DB_PASS must be set, see env.example}
      - TPM_DB_NAME=templates
    volumes:
      - ./docker-entrypoint-initdb16.d/:/docker-entrypoint-initdb.d/:ro
      - ${symbol_dollar}{TPL_DATA_DIR:-./deploy}/postgres16/data:/var/lib/postgresql/data
    expose:
      - 5432

  redis:
    image: redis
    restart: unless-stopped
    expose:
      - 6379
    volumes:
      - ${symbol_dollar}{TPL_DATA_DIR:-./deploy}/redis:/data
    command: [redis-server, '--appendonly yes']

  mongo:
    image: mongo
    restart: unless-stopped
    expose:
      - 27017
    volumes:
      - ${symbol_dollar}{TPL_DATA_DIR:-./deploy}/mongo:/data/db
